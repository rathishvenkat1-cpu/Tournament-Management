{% extends 'base.html' %}

{% block content %}

<h2>Delete Player</h2>

<p>

Are you sure you want to delete

<strong>{{ player.name }}</strong>?

</p>

<form method="POST">

{% csrf_token %}

<button type="submit" class="btn btn-danger">

Delete

</button>

<a href="{% url 'player_list' %}" class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}
